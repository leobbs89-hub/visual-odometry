# ============================================================
# config.yaml — Parâmetros do Pipeline de Odometria Visual
# Edite este arquivo para customizar cada execução.
# ============================================================

# --- Caminhos ---
# Use barras normais "/" mesmo no Windows.
# base_path: "." indica a raiz do próprio projeto.
paths:
  # Apontando para o teste de Map Matching com mapa base NAIP (rota CHAMPAIGN).
  # Scripts de geração/download ficam em map_matching_naip/ (ver README lá).
  base_path: "C:/Users/bbs_l/OneDrive/Leandro/ITA/MESTRADO/Tese/rotas_quadradas/CHAMPAIGN/mach_1.0"
  map_tif:        "../map_v2.vrt"                       # VRT c/ margem 2000m (era 800m em map.vrt — insuficiente p/ roi_margin_factor atual, causava "ROI ultrapassa os limites do GeoTIFF"); ver map_matching_naip/baixar_mapa_naip.py
  images:         "frames/Resized"
  ground_truth:   "Coord-Heading-Elev_1500_1.0.csv"
  output:         "results"                   # relativo a base_path

# --- Câmera ---
# Resolução e campo de visão em graus.
# fx, fy, cx, cy são calculados automaticamente a partir destes valores.
#
# Os valores abaixo descrevem o RECORTE salvo em Resized/, não o viewport
# bruto do Google Earth. O viewport gravado é 640x700 com FOV horizontal de
# 60 graus, o que dá fx = 640/2/tan(30) = 554,2563 px. A partir de 2026-08-03
# o recorte passou a ser 576x576 CENTRADO NO NADIR (antes era 640x640 cortando
# o rodapé, o que deixava o ponto principal 30 px fora do centro — ver
# utils.recortar_frame_google_earth e
# Tese/investigacao_offset_google_earth_causa_raiz.md).
#
# fx NÃO muda com o recorte (é propriedade da renderização, não do corte);
# quem muda é o FOV coberto pelos pixels que sobraram:
#   h_fov = v_fov = 2*atan((576/2)/554,2563) = 54,914152 graus
# Recalcular estes dois valores se FRAME_RECORTE_PX mudar em utils.py.
camera:
  width:  576
  height: 576
  h_fov:  54.914152   # horizontal field of view (graus)
  v_fov:  54.914152   # vertical field of view (graus)

# --- Detector ---
# Opções: ORB | AKAZE | SIFT | SUPERPOINT | LOFTR | MATCHFORMER | ROMA
# Teste da hipótese de cor (2026-07-11): rodada anterior usou ROMA nos dois
# papéis (odometria + map matching) e piorou muito (577,9m) — confundido,
# pois RoMa como odometria parecia estar produzindo pose relativa ruim em
# alguns pares (ver map_matching_naip/CLAUDE.md). Voltando ao SIFT aqui
# (mesmo detector do teste de controle grayscale/RoMa-fake-color de
# 2026-07-10) para isolar o efeito de cor SÓ no map matching — ver
# map_matching.absolute_detector abaixo.
detector: SIFT

# --- Dispositivo para detectores neurais (SUPERPOINT, LOFTR, MATCHFORMER, ROMA) ---
# auto  → usa GPU se disponível, senão roda em CPU automaticamente (recomendado)
# cpu   → força CPU mesmo que haja GPU (mais lento, sem dependência de CUDA)
# cuda  → força GPU; lança erro se não houver CUDA disponível
device: auto

# --- Parâmetros por detector ---
detector_params:
  orb:
    nfeatures:      1500
    scaleFactor:    1.2
    nlevels:        8
    edgeThreshold:  31
    firstLevel:     0
    WTA_K:          2
    scoreType:      HARRIS    # HARRIS ou FAST
    patchSize:      31

  akaze:
    descriptor_type:     MLDB    # MLDB ou MLDB_UPRIGHT
    descriptor_size:     0
    descriptor_channels: 3
    threshold:           0.0001
    nOctaves:            4
    nOctaveLayers:       4
    diffusivity:         PM_G2   # PM_G1 | PM_G2 | WEICKERT | CHARBONNIER

  sift:
    # Otimizado via OFAT (jul/2026) — valores para FLORESTA (textura natural).
    # URBANO se beneficia de contrastThreshold=0.01, edgeThreshold=20, sigma=1.2,
    # nOctaveLayers=4 (ver rodar_experimentos.py e relatorio_otimizacao.md).
    nfeatures:          3000
    nOctaveLayers:       3
    contrastThreshold:   0.04
    edgeThreshold:       10
    sigma:                1.6

  superpoint:
    max_num_keypoints: 800

  loftr:
    pretrained: outdoor   # outdoor ou indoor

  matchformer:
    backbone_type: largela   # litela | largela | litesea | largesea
    ckpt_path: "MatchFormer/weights/outdoor-large-LA.ckpt"   # relativo à pasta visual-odometry/
    resolution: [8, 2]
    fine_window_size: 5
    fine_concat_coarse_feat: true
    coarse:
      d_model: 256
      d_ffn:   256
    fine:
      d_model: 128
      d_ffn:   128
    match_coarse:
      thr:                    0.2
      border_rm:              0
      match_type:             dual_softmax
      dsmax_temperature:      0.1
      train_coarse_percent:   0.2
      train_pad_num_gt_min:   200

  roma:
    # Único detector com backbone (DINOv2) treinado em imagens RGB — usado
    # para testar a hipótese "cor melhora a acurácia" (2026-07-11). Recebe
    # imagens coloridas de verdade (não grayscale replicado em 3 canais),
    # ver detectors.py::RomaDetector e odometria_visual.py::_carregar_dados.
    coarse_res:    560     # resolução interna do matcher grosso (RoMa treina em 560)
    upsample_res:  864     # resolução do refinamento fino
    num_matches:   5000    # nº de correspondências subamostradas por model.sample()
    # sample_thresh: 0.05  # opcional — limiar de confiança p/ sample_mode="threshold"

# --- Correspondências (ORB / AKAZE) ---
matcher:
  nn_match_ratio: 0.8

# --- Map Matching ---
map_matching:
  enabled:   true

  # Detector do módulo de localização absoluta (independente da odometria)
  # Opções: ORB | AKAZE | SUPERPOINT | LOFTR | MATCHFORMER | ROMA
  # Recomendação da dissertação: LOFTR ou MATCHFORMER
  # ROMA setado temporariamente (2026-07-11) junto com o detector de odometria
  # acima, para o teste da hipótese de cor no cenário CHAMPAIGN — ver
  # detector_params.roma. Reverter para SUPERPOINT ao voltar ao experimento
  # principal de map matching NAIP.
  absolute_detector: SUPERPOINT

  interval:  1       # a cada quantos frames executar

  # roi_size_m NÃO é mais um valor fixo em metros. A partir da correção do
  # bug de escala (2026-07-08), a região de busca no mapa é derivada
  # dinamicamente em _inicializar_escala() a partir do GSD real do voo:
  #   roi_size_m = TARGET_PX(480) * gsd_voo_efetivo * roi_margin_factor
  # roi_margin_factor é a folga adimensional sobre o mínimo necessário para
  # preencher o patch de 480px (tolerância a deriva de posição do dead-reckoning).
  roi_margin_factor: 1.3

  # Modo DIAGNÓSTICO (2026-07-08): "estimado" (default) recorta a ROI em
  # torno da posição estimada, como sempre. "real_bbox" usa também a
  # coordenada real (GT) para garantir que ela esteja sempre dentro do
  # recorte pesquisado (evita o efeito "runaway" documentado em
  # map_matching_naip/CLAUDE.md) — não representa um cenário realista de
  # voo sem GPS, serve só para isolar a qualidade do matching do problema
  # de "onde procurar".
  # roi_center_mode: estimado

  # Fator de variação na busca gulosa de escala (±5% por padrão)
  scale_search_step: 0.05

  # Busca de ÂNGULO (fix do "runaway", 2026-07-08): antes de refinar a
  # escala, testa candidatos de ângulo ao redor do yaw estimado pela
  # odometria (que não tem suavização e fica ruidoso em curvas) e escolhe
  # o que der mais inliers. Ver map_matching_naip/CLAUDE.md para o
  # diagnóstico completo.
  # Testado reduzir de 30° para 15° (2026-07-11), baseado num estudo de 25
  # frames onde o offset nunca passou de ±15°. RESULTADO: piorou (erro
  # acumulado 221.7m -> 455.3m, MAP_OK caiu de 100% para 92% no mesmo
  # cenário) — revertido para 30°. Ver project_map_matching_offset_yaw.md
  # (memória) para os dois estudos. Conclusão: mesmo o offset nunca batendo
  # no limite antigo numa amostra, cortar o alcance do bracket reduz
  # robustez (provavelmente por causa da natureza estocástica do RANSAC
  # combinada com casos onde o candidato salvador só aparece fora de ±15°
  # em frames que não estavam na amostra original) — não reduzir sem
  # validação mais ampla (múltiplas rodadas, mais cenários).
  angle_search_range_deg: 30.0    # bracket: yaw_estimado ± este valor
  angle_search_candidates: 5      # nº de candidatos no bracket (inclui offset=0)

  # Limiares mínimos de inliers (Tabela 3.1 da dissertação)
  # Se comentados, usa os valores padrão por descritor definidos no código
  # inlier_thr_position:    20
  # inlier_thr_angle_scale: 40

# --- Parâmetros internos do pipeline ---
pipeline:
  yaw_filter:
    # Ignora a rotação estimada (yaw_delta = 0) se:
    #   i <= max_initial_frames E |yaw_delta| > max_initial_yaw_deg
    #   OU qualidade do frame baixa (RANSAC divergiu / matches de baixa confiança):
    #     - detectores clássicos (ORB/AKAZE/SIFT, sem confiança por match): inlier_ratio < min_inlier_ratio
    #     - detectores neurais (SUPERPOINT/LOFTR/MATCHFORMER, expõem confiança por match):
    #       confiança média dos inliers do RANSAC < min_confidence
    max_initial_frames:  2
    max_initial_yaw_deg: 45
    min_inlier_ratio:    0.10
    min_confidence:      0.20

  # Semear a distância do primeiro par de frames (i=0) com o valor real
  # (GPS) em vez do valor estimado visualmente.
  #
  # DESLIGADO em 2026-08-03. Isto era um paliativo para a causa raiz que foi
  # corrigida na origem: o Movie Maker grava o render de t=0 duas vezes e nunca
  # salva o frame de t=1, então "-000002.png" (rotulado t=1 pela convenção
  # antiga) era fisicamente a posição de t=2 — daí DIST_EST(IMG=0) sair ~2,00×
  # DIST_REAL. A observação original estava certa; o que faltou foi perceber
  # que o mesmo deslocamento valia para a rota INTEIRA, não só o primeiro
  # passo. Com a associação CSV<->frame corrigida (utils.recortar_para_dataset
  # + utils.nome_frame, e a migração dos datasets já capturados em
  # Tese/rotas_quadradas/corrigir_associacao_frames.py) o 2× desaparece
  # sozinho, e manter a semente passaria a INJETAR ground truth numa estimativa
  # que já está correta.
  #
  # Ver Tese/investigacao_offset_google_earth_causa_raiz.md, seção B.
  first_step_gps_seed: false

# --- Visualização e Logs ---
display:
  show_plot:          true   # gráfico de trajetória em tempo real (desligado temporariamente p/ verificação headless — travava em GUI, ver conversa 2026-07-11)
  show_images:        false   # janela com correspondências entre frames
  print_console:      true    # imprime os resultados frame a frame no console
  show_map_matching:  true   # janela OpenCV com correspondências do map matching (idem)
  debug_map_matching: true   # pausa em cada frame e exibe imagens do map matching
